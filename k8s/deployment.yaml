apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-term-api-deployment
spec:
 replicas: 1
 selector:
  matchLabels:
    app: legal-term-api
 template:
  metadata:
    labels:
     app: legal-term-api
  spec:
    containers:
    - name: legal-term-api
      image: tatia7/legal-term-api:0e569211a9f462294fe48d7b8ca6b5c8ae1366a2
      imagePullPolicy: IfNotPresent
      ports:
      - containerPort: 8000 
