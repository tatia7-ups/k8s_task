apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-term-api-deployment
spec:
 replicas: 1
 selector:
  matchLabels:
    app: legal-term-api
 template:
  metadata:
    labels:
     app: legal-term-api
  spec:
    containers:
    - name: legal-term-api
      image: legal-term-api:latest
      imagePullPolicy: IfNotPresent
      ports:
      - containerPort: 8000 
