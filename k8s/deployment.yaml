apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-term-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legal-term-api
  template:
    metadata:
      labels:
        app: legal-term-api
    spec:
      containers:
      - name: legal-term-api
        image: tatia7/legal-term-api:35edf99b1de2da740a1423f821bf025da8651b31
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
